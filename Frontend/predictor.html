
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentAI | Performance Predictor</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f4fc;
            color: #292653;
            font-family: Arial, sans-serif;
        }

        .predictor-container {
            width: 100%;
            max-width: 620px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(50, 40, 100, .09);
            border: 1px solid #ece9f8;
        }

        .predictor-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .predictor-icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            font-size: 35px;
        }

        .predictor-header h1 {
            font-size: 25px;
            margin: 0 0 10px;
            color: #292653;
        }

        .predictor-header p {
            color: #85859c;
            line-height: 1.6;
            margin: 0;
        }

        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #414365;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedaf3;
            border-radius: 11px;
            background: #fcfbff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7056ed;
            box-shadow: 0 0 0 3px rgba(112, 86, 237, .12);
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .predict-btn:hover {
            opacity: .92;
        }

        #predictionResult {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border: 1px solid #dedaf3;
            border-radius: 11px;
            background: white;
            color: #6254d9;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #f5f2ff;
        }

        @media(max-width: 500px) {
            .predictor-container {
                padding: 25px 20px;
            }

            .predictor-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="predictor-container">

        <header class="predictor-header">
            <div class="predictor-icon">🤖</div>
            <h1>AI Academic Performance Predictor</h1>
            <p>Analyze your academic performance and predict your progress.</p>
        </header>

        <form id="predictorForm">

            <div class="form-group">
                <label for="attendance">📅 Attendance Percentage (%)</label>
                <input
                    type="number"
                    id="attendance"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Example: 85"
                    required
                >
            </div>

            <div class="form-group">
                <label for="marks">📝 Average Marks Percentage (%)</label>
                <input
                    type="number"
                    id="marks"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Example: 80"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studyHours">⏰ Daily Study Hours</label>
                <input
                    type="number"
                    id="studyHours"
                    min="0"
                    max="24"
                    step="0.5"
                    placeholder="Example: 4"
                    required
                >
            </div>

            <button type="submit" class="predict-btn">
                ✨ Predict My Performance
            </button>

        </form>

        <div id="predictionResult"></div>

        <button class="back-btn"
                onclick="window.location.href='index.html'">
            ← Back to Dashboard
        </button>

    </main>

    <script src="predictor.js"></script>

</body>
</html>
