
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | StudentAI</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f4fc;
            color: #25264f;
        }

        .profile-page {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .profile-header {
            margin-bottom: 28px;
        }

        .profile-header h1 {
            color: #25264f;
            margin: 10px 0;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(35, 40, 90, 0.07);
            margin-bottom: 24px;
        }

        .profile-card h2 {
            color: #292653;
            margin-top: 0;
        }

        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 10px auto 18px;
        }

        .profile-card label {
            display: block;
            font-weight: 600;
            color: #414365;
            margin-bottom: 8px;
        }

        .profile-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedaf3;
            border-radius: 11px;
            background: #fcfbff;
            font-size: 15px;
            outline: none;
        }

        .profile-card input:focus {
            border-color: #7056ed;
            box-shadow: 0 0 0 3px rgba(112, 86, 237, 0.12);
        }

        .profile-card input[readonly] {
            background: #f0eff7;
            color: #777b96;
            cursor: not-allowed;
        }

        .profile-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .profile-primary-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
        }

        #profileMessage {
            margin-top: 18px;
            font-weight: 600;
        }

        .profile-back {
            border: none;
            border-radius: 11px;
            padding: 13px 20px;
            background: #292653;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 28px;
        }

        @media(max-width: 650px) {
            .profile-form-grid {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="profile-page">

        <header class="profile-header">
            <p class="eyebrow">YOUR STUDENT ACCOUNT</p>

            <h1>🎓 Student Profile</h1>

            <p class="muted">
                Manage your personal details and academic information.
            </p>
        </header>

        <section class="profile-card">

            <div class="profile-avatar">🎓</div>

            <h2 style="text-align:center;">My Personal Information</h2>

            <p class="muted" style="text-align:center;">
                Keep your student information updated.
            </p>

            <form id="profileForm">

                <div class="profile-form-grid">

                    <div>
                        <label for="profileName">Full Name</label>

                        <input
                            type="text"
                            id="profileName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div>
                        <label for="profileEmail">Email Address</label>

                        <input
                            type="email"
                            id="profileEmail"
                            readonly
                        >
                    </div>

                    <div>
                        <label for="profileCourse">Course</label>

                        <input
                            type="text"
                            id="profileCourse"
                            value="MCA"
                            required
                        >
                    </div>

                    <div>
                        <label for="profileSemester">Semester</label>

                        <input
                            type="text"
                            id="profileSemester"
                            value="3rd Semester"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="profile-primary-btn">
                    💾 Save Profile
                </button>

            </form>

            <p id="profileMessage"></p>

        </section>

        <button
            type="button"
            class="profile-back"
            onclick="window.location.href='index.html'"
        >
            ← Back to Dashboard
        </button>

        <footer class="muted">
            StudentAI · Student Profile · MCA Minor Project
        </footer>

    </main>

    <script src="profile.js"></script>

</body>
</html>
