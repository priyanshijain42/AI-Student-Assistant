
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentAI | Login & Registration</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #eeecff, #f8f7ff, #e8e5ff);
            color: #25264f;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(45, 38, 100, .12);
        }

        .auth-logo {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            font-size: 36px;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-heading h1 {
            color: #292653;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .auth-heading p {
            color: #85859c;
            line-height: 1.6;
            margin: 0;
        }

        .auth-card label {
            display: block;
            color: #414365;
            font-weight: 600;
            margin-bottom: 17px;
        }

        .auth-card input {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 9px;
            border: 1px solid #dedaf3;
            border-radius: 11px;
            background: #fcfbff;
            font-size: 15px;
            outline: none;
        }

        .auth-card input:focus {
            border-color: #7056ed;
            box-shadow: 0 0 0 3px rgba(112, 86, 237, .12);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6254e7, #895cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .auth-btn:hover {
            opacity: .92;
        }

        .auth-switch {
            text-align: center;
            color: #777b96;
            margin-top: 23px;
            line-height: 1.7;
        }

        .auth-switch a {
            color: #6853dc;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .auth-footer {
            text-align: center;
            color: #8989a0;
            font-size: 13px;
            margin-top: 22px;
        }

        @media(max-width: 500px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">🎓</div>

            <header class="auth-heading">
                <h1>StudentAI</h1>
                <p>Welcome! Your smart academic journey starts here.</p>
            </header>

            <!-- Registration Form -->
            <form id="registerForm">

                <label for="name">
                    Full Name
                    <input
                        id="name"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >
                </label>

                <label for="email">
                    Email Address
                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >
                </label>

                <label for="password">
                    Password
                    <input
                        id="password"
                        type="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >
                </label>

                <button type="submit" class="auth-btn">
                    ✨ Create Account
                </button>

            </form>

            <!-- Login Form -->
            <form id="loginForm" style="display:none;">

                <label for="loginEmail">
                    Email Address
                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >
                </label>

                <label for="loginPassword">
                    Password
                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >
                </label>

                <button type="submit" class="auth-btn">
                    🔐 Login to StudentAI
                </button>

            </form>

            <p id="message"></p>

            <div class="auth-switch">
                <p id="registerSwitch">
                    Already registered?
                    <a href="login.html" onclick="showLogin(event)">
                        Login here
                    </a>
                </p>

                <p id="loginSwitch" style="display:none;">
                    Don't have an account?
                    <a href="login.html" onclick="showRegister(event)">
                        Register here
                    </a>
                </p>
            </div>

        </section>

        <footer class="auth-footer">
            StudentAI · AI Student Assistant · MCA Minor Project
        </footer>

    </main>

    <script src="auth.js"></script>

</body>
</html>
